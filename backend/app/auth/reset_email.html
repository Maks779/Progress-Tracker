<!doctype html>
<html lang="{lang}">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<title>{subject}</title>
</head>
<body style="margin:0;padding:0;background:#FAFAF7;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FAFAF7;">
<tr><td align="center" style="padding:32px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
  style="max-width:520px;background:#FFFFFF;border:1px solid #E7E7E2;border-radius:16px;font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;color:#0B0D0C;">
<tr><td style="padding:32px 32px 0;font-size:18px;font-weight:700;">Ember</td></tr>
<tr><td style="padding:24px 32px 0;font-size:14px;line-height:22px;">{greeting}</td></tr>
<tr><td style="padding:8px 32px 0;font-size:22px;line-height:30px;font-weight:600;">{title}</td></tr>
<tr><td style="padding:12px 32px 0;font-size:14px;line-height:22px;color:#6B716E;">{body}</td></tr>
<tr><td style="padding:24px 32px 0;">
<a href="{link}"
  style="display:inline-block;background:#FF5A36;color:#0B0D0C;font-size:14px;font-weight:600;text-decoration:none;padding:12px 20px;border-radius:12px;">{button}</a>
</td></tr>
<tr><td style="padding:24px 32px 0;font-size:12px;line-height:18px;color:#6B716E;">
{fallback}<br>
<a href="{link}" style="color:#D93A14;word-break:break-all;">{link}</a>
</td></tr>
<tr><td style="padding:24px 32px 32px;font-size:12px;line-height:18px;color:#6B716E;">{ignore}</td></tr>
</table>
<p style="margin:16px 0 0;font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;font-size:12px;color:#6B716E;">Ember · {tagline}</p>
</td></tr>
</table>
</body>
</html>
